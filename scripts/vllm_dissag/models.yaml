# ============================ MoE (TP + wideEP) ============================

# DeepSeek-V3 family. The env: block encodes the validated MoRI-EP recipe knobs
# (from MAD-private #324 DeepSeekV3_recipe.env). They are exported BEFORE the
# connector's setup_env, so they define the wideEP recipe by default while still
# yielding to a submit-time `-e` override. WIDE_EP=1 (wideEP) reads these; the
# connector emits --block-size/--kv-cache-memory-bytes/--all2all-backend from them.
# The tp: blocks are the TP-mode (WIDE_EP=0) flags (dense-style serving).
#   - block=16 + AITER_MLA=0: block=1 + AITER-MLA fp8 decode kernel GPU-faults.
#   - KV_CACHE_MEMORY_BYTES: skip the boot profiling forward (AITER eager fp8 quant
#     aiter_tensor_t bug). PREFILL cudagraph NONE (capture deadlocks 16-way DP),
#     DECODE PIECEWISE (ITL win). Per-role mori backends: prefill HT, decode LL.
#   - MoRIIO disagg fixes (#39276 etc.) are committed in-source in the image's vLLM
#     (Dockerfile VLLM_REF), so there is no runtime patcher to gate.
_deepseek_recipe_env: &deepseek_recipe_env
  VLLM_USE_V1: "1"
  VLLM_ROCM_USE_AITER: "1"
  VLLM_ROCM_USE_AITER_PAGED_ATTN: "0"
  VLLM_ROCM_USE_AITER_RMSNORM: "1"
  VLLM_USE_AITER_TRITON_SILU_MUL: "0"
  VLLM_ROCM_USE_AITER_MLA: "0"
  KV_BLOCK_SIZE: "16"
  KV_CACHE_DTYPE: "fp8"
  KV_CACHE_MEMORY_BYTES: "20000000000"
  GPU_MEMORY_UTILIZATION: "0.80"
  VLLM_CUDAGRAPH_MODE: "PIECEWISE"
  PREFILL_CUDAGRAPH_MODE: "NONE"
  DECODE_CUDAGRAPH_MODE: "PIECEWISE"
  CUDAGRAPH_CAPTURE_SIZES: "1 2 4 8 16 32 64 128 256"
  TORCHINDUCTOR_BENCHMARK_KERNEL: "0"
  VLLM_ALL2ALL_BACKEND: "mori_high_throughput"
  PREFILL_MORI_BACKEND: "mori_high_throughput"
  DECODE_MORI_BACKEND: "mori_low_latency"
  MORI_SHMEM_HEAP_SIZE: "17179869184"

# DeepSeek family is wideEP-only (gated in run_xPyD_models.slurm: TP mode is rejected).
# The dp: blocks are empty because the moriio(mori) connector emits the validated
# wideEP serve flags (block-size, kv-cache-*, all2all, cudagraph) from the env: recipe
# above. No tp: blocks — TP is unsupported for these models.
DeepSeek-V3:
  env: *deepseek_recipe_env
  prefill:
    dp: ""
  decode:
    dp: ""

DeepSeek-V3-5layer:
  env: *deepseek_recipe_env
  prefill:
    dp: ""
  decode:
    dp: ""

DeepSeek-R1:
  env: *deepseek_recipe_env
  prefill:
    dp: ""
  decode:
    dp: ""

# Kimi-K3-MXFP4 (MI300X gfx942 wideEP disagg). Recipe knobs from
# scripts/vllm/kimik3_mi300x/wideep_disagg_2p2d/; vLLM connector fixes live in the
# disagg image (raviguptaamd/vllm @ kimi-k3-wideep-disagg-fullsource-v3).
_kimik3_recipe_env: &kimik3_recipe_env
  VLLM_USE_V1: "1"
  NCCL_DEBUG: "WARN"
  NCCL_DEBUG_SUBSYS: "INIT,NET"
  # MI300X + CX-7 RoCE fabric (from PR241 fabric_env.sh). RDMA rails only; exclude
  # mgmt NICs mlx5_1(eth0)/mlx5_6(eth1). Required on -pr241-src image which does not
  # bake NCCL_IB_HCA -> NCCL else grabs eth NICs and QP INIT->RTR times out (errno 110).
  # NOTE: rail-7 (mlx5_9) dropped: fabric fault on that rail between prefill nodes 027<->085
  # (10.224.29.142 unreachable). Uneven NIC counts misalign NCCL device indices -> cross-rail
  # QP INIT->RTR timeout. Restricting all nodes to the 7 healthy, index-aligned rails.
  NCCL_IB_HCA: "mlx5_0,mlx5_2,mlx5_3,mlx5_4,mlx5_5,mlx5_7,mlx5_8"
  MORI_RDMA_DEVICES: "mlx5_0,mlx5_2,mlx5_3,mlx5_4,mlx5_5,mlx5_7,mlx5_8"
  NCCL_IB_GID_INDEX: "3"
  NCCL_IB_DISABLE: "0"
  NCCL_SOCKET_IFNAME: "eth0"
  GLOO_SOCKET_IFNAME: "eth0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  VLLM_ROCM_USE_AITER: "1"
  VLLM_ROCM_USE_AITER_MLA: "0"
  VLLM_ROCM_USE_AITER_MOE: "1"
  VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "0"
  VLLM_USE_AITER_TRITON_SILU_MUL: "0"
  VLLM_ROCM_USE_AITER_RMSNORM: "1"
  AITER_SITUV2_A8W4: "1"
  VLLM_ROCM_USE_AITER_MOE_SITUV2_A8W4: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "64"
  K3_MLA_SINGLE_SPLIT: "1"
  K3_MLA_FULL_PREFILL: "1"
  K3_GROUP_ROUTING: "1"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  KV_BLOCK_SIZE: "16"
  KV_CACHE_DTYPE: "fp8"
  KV_CACHE_MEMORY_BYTES: "8000000000"
  GPU_MEMORY_UTILIZATION: "0.85"
  MAX_NUM_BATCHED_TOKENS: "2048"
  MAX_MODEL_LEN: "320000"
  PREFILL_CUDAGRAPH_MODE: "NONE"
  # 241-formal decode: FULL_AND_PIECEWISE. Boots on v4 only when capture sizes are
  # trimmed to [1,2,4] (matches max_num_seqs=32 wave). Full [1..256] OOMs (~143GiB/GPU);
  # [1..32] still aborts at capture. [1,2,4] validated bootable (parallel sweep Cell B).
  DECODE_CUDAGRAPH_MODE: "FULL_AND_PIECEWISE"
  CUDAGRAPH_CAPTURE_SIZES: "1 2 4"
  VLLM_ALL2ALL_BACKEND: "mori_low_latency"
  PREFILL_MORI_BACKEND: "mori_high_throughput"
  DECODE_MORI_BACKEND: "mori_low_latency"
  MORI_SHMEM_HEAP_SIZE: "8589934592"
  # Deterministic RDMA read-after-write barrier: forces written KV globally visible in
  # the receiver's HBM before write_done (moriio_engine.py). Fixes the P->D write-race
  # seen as "unmap MISS table_size=0" / "missing remote notify address" on repeat requests
  # (KV blocks then leak on prefill -> stall). Lives in connectors/moriio.env, which the
  # interactive drive_cell.sh path does NOT source, so it must be in the recipe env to
  # propagate. Verified unset in the EngineCore process env on the failing run.
  # NOTE: readback DISABLED. In the -pr241-src image, read_remote_data() -> libmori
  # session.batch_read() passes scalars but this libmori's BatchRead binding requires
  # sequences -> throws every request ("k3-readback failed ... continuing", moriio_engine.py:561)
  # so the read-after-write fence never runs and decode reads stale remote HBM -> garbage
  # output / non-deterministic recall. Verified 0/4 NIAH recall with token-salad output on 434689.
  # We instead use the WORKING sleep fence (K3_WRITE_FENCE) + device sync (K3_WRITE_DEVSYNC),
  # which do not touch the broken batch_read path.
  K3_WRITE_READBACK: "0"
  K3_WRITE_FENCE: "1"
  K3_WRITE_DEVSYNC: "1"
  # --- PR241 parity additions (audit 2026-09-15) ---
  # These PR241 vars lived only in connectors/moriio.env or moriio.sh defaults and were
  # NOT reaching the container on the interactive drive_cell.sh path (moriio.env is only
  # sourced by run_xPyD_models.slurm). Added here so the interactive path matches PR241's
  # validated -e block, to stop discovering missing vars one reboot at a time.
  # NCCL reliability + watchdog (PR241 docker -e block):
  NCCL_IB_TIMEOUT: "22"
  TORCH_NCCL_ENABLE_MONITORING: "0"
  TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "1800"
  TORCH_NCCL_DUMP_ON_TIMEOUT: "0"
  TORCH_NCCL_BLOCKING_WAIT: "0"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  # AITER MHA (PR241 sets =1 explicitly; moriio.sh does not set it):
  VLLM_ROCM_USE_AITER_MHA: "1"
  # MoRI RDMA knobs (moriio.env-only -> did not propagate interactively):
  MORI_IB_ENABLE_RELAXED_ORDERING: "1"
  MORI_IO_SL: "1"
  # MoRI QP counts: moriio.sh defaults (4) are BELOW PR241; pin to PR241 values:
  MORI_NUM_QP_PER_PE: "8"
  VLLM_MORIIO_QP_PER_TRANSFER: "2"
  # GID index: interactive gets 3 from moriio.sh, but moriio.env sets 1 -> pin to 3 to
  # avoid the wrong value on the slurm path too:
  MORI_IB_GID_INDEX: "3"
  # K3 gate knob:
  K3_CHUNK_GATE_SLACK: "2"
  # Sleep-fence duration (used because K3_WRITE_FENCE=1 above; readback is broken in this image):
  K3_WRITE_FENCE_MS: "20"

Kimi-K3-MXFP4:
  env: *kimik3_recipe_env
  prefill:
    dp: '--served-model-name kimi-k3 --reasoning-parser kimi_k3 --mm-encoder-tp-mode data --safetensors-load-strategy lazy --max-model-len 320000 --max-num-seqs 32'

  decode:
    dp: '--served-model-name kimi-k3 --reasoning-parser kimi_k3 --mm-encoder-tp-mode data --safetensors-load-strategy lazy --max-model-len 320000 --max-num-seqs 32'

